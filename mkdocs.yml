site_name: Semiconductor Characterisation Techniques
site_url: https://oxford-emat-lab.github.io/semiconductor-characterisation/
site_description: Interactive notebooks explaining the physical principles behind semiconductor characterisation techniques.
repo_url: https://github.com/Oxford-eMat-Lab/semiconductor-characterisation
repo_name: Oxford-eMat-Lab/semiconductor-characterisation

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate

nav:
  - Home: index.md
  - Transfer Length Method (TLM): tlm.md
  - External Quantum Efficiency (EQE): eqe.md
  - Kelvin Probe & Surface Photovoltage (KP/SPV): kpspv.md
  - Capacitance-Voltage & Conductance-Voltage (C-V/G-V): cgv.md

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
